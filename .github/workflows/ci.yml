name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Runs the Shopify CLI directly. shopify/theme-check-action@v2 installs the latest CLI and then
      # crashes parsing its output (TypeError: e.filter is not a function). The CLI version is pinned
      # so a CLI release can't break CI; bump it deliberately.
      - name: Theme Check
        run: npx --yes @shopify/cli@5.1.0 theme check --path . --fail-level error

  docs:
    name: Docs links and CSVs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check docs
        run: python3 .github/scripts/check_docs.py
